# Construye el portal (sin los Excel) y lo copia al repositorio público
# Provalliance2026/dashboards, que lo sirve con GitHub Pages.
# Requiere el secreto PORTAL_DEPLOY_KEY: clave SSH privada cuya parte pública
# está añadida como "Deploy key" con permiso de escritura en el repositorio público.
name: Publicar portal de dashboards

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portal
  cancel-in-progress: true

env:
  REPO_PUBLICO: Provalliance2026/dashboards

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/generar_portal.py

      - name: Comprobar que no se publica ningún fichero de datos
        run: |
          if find _site -type f \( -iname '*.xlsx' -o -iname '*.xlsm' -o -iname '*.xls' -o -iname '*.csv' \) | grep .; then
            echo "Hay ficheros de datos en _site" && exit 1
          fi

      - if: github.event_name != 'pull_request'
        uses: actions/checkout@v4
        with:
          repository: ${{ env.REPO_PUBLICO }}
          ssh-key: ${{ secrets.PORTAL_DEPLOY_KEY }}
          path: publico

      - if: github.event_name != 'pull_request'
        name: Copiar el portal al repositorio público
        run: |
          rsync -a --delete --exclude .git _site/ publico/
          touch publico/.nojekyll
          cd publico
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Sin cambios en el portal"
          else
            git commit -m "Actualizar portal desde ${GITHUB_REPOSITORY}@${GITHUB_SHA::7}"
            git push
          fi
